# The Python packages of roboarc-ikea (images/ikea-mujoco/Dockerfile): exact versions, one wheel each by sha256 (the
# cp312 manylinux x86_64 file pip selects), installed with --no-deps --require-hashes, so nothing resolves at build time.
# The versions are those of the 1.0.0 image. mujoco 3.14.0 (its libmujoco.so is byte-patched after the install) and
# numpy 2.5.4 are the physics; glfw, PyOpenGL and typing-extensions are what `import mujoco` and its renderer load;
# imageio, imageio-ffmpeg (its ffmpeg binary encodes the replay video) and Pillow are the verifier's replay video.
