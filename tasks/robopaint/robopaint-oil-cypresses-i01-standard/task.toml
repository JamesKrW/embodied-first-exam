schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/episode.json", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/canvas_live.png", service = "sim" },       # the live episode's main sheet, the one that was scored
  { source = "/data/canvas_live_practice.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  "/app/output/",
]

[task]
name = "embodied-first-exam/robopaint-oil-cypresses-i01-standard"
description = "RoboPaint oil painting from a reference, STANDARD MODE (robot as a service, eai-standard/2.2): embodied robotic oil painting (ManiSkill 3.0.1 Franka Panda with an oil-paint brush; libmypaint 1.6.1 paints) on the same frozen instance as the privileged task: paint the picture target.png (a square crop of Vincent van Gogh's Wheat Field with Cypresses, 1889) onto the main sheet in at most 2504 strokes, with 16 premixed paints and a practice sheet for test strokes. The agent only gets a client: get_obs (camera RGB + proprioception), submit (ee_pose or joint_position chunks). No reset, no sheet readout, no brush model, no score; the sim service records the episode and scores its main sheet at a 1 mm scale against the picture (success iff mean CIELAB ΔE <= 7.5, p90 ΔE <= 12.5, SSIM of L* >= 0.68, edge correlation >= 0.65, paint IoU >= 0.96 (all after the best single shift of the sheet, at most 5 mm along each axis, inside the central area 8 mm in from the sheet's edges) and at most 2504 strokes). Process rules: paint with brush strokes the way a person paints; colouring in or filling areas with a thin line, zigzag, serpentine or contour-offset fills fail; the brush tip's path pressed on the main sheet with paint is at most 51600 mm in total, and at most 10 % of it in strokes longer than 2.5 x the diagonal of their bounding box."
keywords = ["robotics", "robopaint", "maniskill", "sapien", "painting", "oil-painting", "mypaint", "brush", "paint-from-reference", "franka", "standard-mode", "trajectory", "robopaint_oil_cypresses"]

[metadata]
task_type = "trajectory"
simulator = "maniskill"
robot = "franka-panda"
family = "robopaint_oil_cypresses"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "partial"                # solution/: the privileged oracle's joint targets, streamed through the client
oracle_evidence = "Reference solution in solution/ (streams the privileged reference's joint targets; tasks/robopaint/README.md, Targets). The same trajectory scores 1 under the process rules in the verifier (the graders' rcb_brush_strict.py, with which the sim service also scores the live sheet) (2026-10-09): path_mm 17170 of the 51600 mm budget; its strokes are sweeps. Harbor oracle and nop runs: tasks/robopaint/README.md (Oil: the pointed brush)."
instance_seed = 0
expert_time_estimate_hours = 6.0
difficulty = "extreme"          # RoboPaint tiers: acrylic stroke copy hard, oil paint-from-reference extreme
medium = "mypaint"
stroke_count = 1669               # difficulty axes: the reference solution's strokes, the stroke budget, paints, brush sizes, the picture
stroke_budget = 2504
palette_size = 16
brush_sizes_mm = [11.0, 6.0, 3.6, 2.6, 2.1]
picture_detail = 3.132          # mean |grad L*| per mm of the picture at the 1 mm judging scale
palette_floor_de = 6.46          # mean ΔE of the picture to its nearest premixed paint (no blending)
reference_de_mean = 6.76
reference_ssim_L = 0.727
source_image = "File:Vincent van Gogh - Wheat Field with Cypresses - Google Art Project.jpg"
source_license = "Public domain"
source_artist = "Vincent van Gogh"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode: the service scores its live sheet (the verdict), then renders the video once
timeout_sec = 2820                # ending a service that is resuming (up to 1500 s) + one render pass of at most 72,000 control steps

[agent]
timeout_sec = 3600.0              # the agent's cutoff, this task's own (PROTOCOL §2)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 5120
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
