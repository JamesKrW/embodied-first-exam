# Standard mode: the simulator runs in the `sim` sidecar (agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# The GPU is reserved for the sidecar: SAPIEN needs a Vulkan device to build the scene and render the cameras (physics and the
# brush model run on the CPU). Crash recovery (docs/protocol/standard_mode.md §13): run.sh exits non-zero when the service crashes,
# compose restarts the same container (its /data record stays) and the service resumes the episode from its journal.
services:
  main:
    pids_limit: 2048   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 3   # rcb-monitor
    mem_limit: 11264m   # rcb-monitor
    pids_limit: 1024   # rcb-monitor
    x-gpu-memory-gb: 3   # GiB   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_TASK: robopaint_oil_pearlearring
      RCB_INSTANCE: /srv/instance.json
      RCB_TOOL: /srv/rcb_brush_strict.py   # the sim service scores the live sheet with it: the picture rule and the process rules
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "600"     # startup watchdog: >= 4x the slowest measured start (126 s; tasks/robopaint/README.md)
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""           # the sidecar's own Session must not write the agent-side interaction log
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
