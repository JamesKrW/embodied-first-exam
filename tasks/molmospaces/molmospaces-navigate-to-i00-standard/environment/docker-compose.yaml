# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# Rendering runs on an NVIDIA GPU (EGL), physics on the CPU. Crash recovery (docs/protocol/standard_mode.md §13): run.sh exits
# non-zero when the service crashes and compose restarts the same container (its /data kept); the service resumes the
# episode from its journal. RCB_STARTUP_TIMEOUT_S: the startup watchdog (an episode starts 8-52 s after Harbor's
# environment setup begins, docs/protocol/standard_mode.md §13.4).
services:
  main:
    pids_limit: 8192   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 12288m   # rcb-monitor
    pids_limit: 8192   # rcb-monitor
    x-gpu-memory-gb: 7   # GiB   # rcb-monitor
    build:   # environment/sim/Dockerfile: the base image, sim/ at /srv, the files shared with other tasks
      context: sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TOOL: /srv/rcb_molmospaces.py
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "3600"
      RCB_STARTUP_TIMEOUT_S: "300"
      RCB_ACTION_UNITS: "base_x, base_y in m and base_theta in rad (world frame); torso, arm joints in rad; grippers: the finger motor's force, -100 .. 100 (positive closes, negative opens, 0 exerts none)"
      PYTHONPATH: /srv
      RCB_SESSION_LOG: ""
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:69dcd5dd5dff08cfc35fc891e2563a374b6c4cc156be84ee88b9db456662f726
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure:3
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
