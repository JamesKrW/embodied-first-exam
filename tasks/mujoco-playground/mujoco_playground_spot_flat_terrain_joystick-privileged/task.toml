schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/", "/logs/agent/rcb/"]

[task]
name = "embodied-first-exam/mujoco_playground_spot_flat_terrain_joystick-privileged"
description = "MuJoCo Playground SpotFlatTerrainJoystick in plain MuJoCo (Boston Dynamics Spot, joint position control every 0.02 s): Make Boston Dynamics Spot follow the joystick command schedule on flat ground for the whole 20 s episode without falling over. Produce one replayable trajectory of joint position targets on a frozen instance (Playground's reset with seed 0); graded by velocity tracking over the whole 20 s schedule without a fall (two fresh-process replays)."
keywords = ["robotics", "mujoco", "mujoco-playground", "boston-dynamics-spot", "quadruped", "locomotion", "joystick", "code-as-policy", "trajectory", "privileged"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "boston-dynamics-spot"
family = "mujoco_playground/SpotFlatTerrainJoystick"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "full"
instance_seed = 0             # the PRNGKey of Playground's reset (and, for the joystick tasks, its command process)
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 1800.0
# MuJoCo Playground's trained policies are public upstream, so the agent reaches the model APIs and the package registries, nothing else
# (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
