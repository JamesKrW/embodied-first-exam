# Standard mode: the simulator runs in the `sim` sidecar (the agent cannot open it); the agent only reaches port 8000.
# No `expose`/`ports` on sim: under Harbor's egress control it shares main's network namespace (localhost:8000).
# CPU only: MuJoCo physics and OSMesa rendering (~15 ms per 320x320 image); no GPU reservation.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 4   # rcb-monitor
    mem_limit: 11264m   # rcb-monitor
    pids_limit: 1024   # rcb-monitor
    build:   # the VLABench image: environment/sim/Dockerfile
      context: ./sim
      dockerfile: Dockerfile
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:vlabench-0.2.0"]   # the prebuilt vlabench-base layers: pulled when the runner can, else built
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
    command: python /srv/server.py
    restart: on-failure:6                               # a crash resumes the same episode, never a reset (rcb_service.py)
    environment:
      RCB_INSTANCE: /srv/instance.json
      RCB_TASK_TEXT: "I am so thirsty after sport, I want to drink something healthy cool: take it out of the small fridge and close the fridge door."
      RCB_EPISODE: "Ends when the task succeeds (reason \"success\"), after 9000 control steps (\"failed\"), when your time is up (\"timeout\"), or on a simulator error (\"error\")."
      RCB_WALL_CLOCK_S: "1800.0"
      RCB_MAX_CONTROL_STEPS: "9000"
      RCB_IMAGE_HW: "320"
      # One episode, no reset, as instruction.md tells the agent: pinned, not a knob (a `${RCB_RESET_BUDGET:-0}` here
      # would take the budget from the shell that runs harbor, and a host that exports it for another benchmark would
      # hand this task resets its instruction rules out).
      RCB_RESET_BUDGET: "0"
      PYTHONPATH: /srv:/opt/VLABench:/opt/rrt-algorithms
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
  # <<< rcb_monitor
volumes:   # rcb-monitor
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
