# Standard-mode twin of humanclaw-sit-bed-i01-privileged.
schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/humanclaw-sit-bed-i01-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): HumanCLAW find-navigate-interact (bed) on the same frozen episode as humanclaw-sit-bed-i01-privileged. Find the bed and move until your body is touching the target, with zero distance to the target object. Finally, sit on the bed. The agent only gets a client: /observe and /submit (head-camera RGB, actions used / left, pelvis height change; one motion skill per row). One episode, no reset, no privileged state, no score; the sim service grades the live episode (nothing is replayed)."
authors = [{ name = "Kangrui Wang" }]
keywords = ["robotics", "humanclaw", "habitat-sim", "humanoid", "navigation", "standard-mode", "trajectory", "bed"]

[metadata]
author_name = "Kangrui Wang"
task_type = "trajectory"
simulator = "humanclaw"
robot = "smplx-human"
family = "sit-bed"
mode = "standard"
dynamics = "static"
protocol = "eai-standard/2.1"
instance_seed = 0
expert_time_estimate_hours = 0.5
oracle = "full"
oracle_evidence = "the privileged oracle's 34 actions streamed as skill rows through the client (open loop: they succeed on L40S and RTX 4090); harbor oracle run on RTX 4090: reward 1, graded live"

[metadata.resources]
min_cpus = 4.0
min_memory_gb = 8.0
min_gpu_memory_gb = 4.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 1.0
verifier_min_memory_gb = 1.0
verifier_min_gpu_memory_gb = 0.0
measured = "author estimate, not yet measured: MotionDiT 1.6 GB GPU (RTX 4090, 20 skills), Habitat EGL rendering on top"

[metadata.resources.limits]
scope = "agent"
max_gpu_memory_gb = 0.0
max_memory_gb = 8.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 24.0
measured = "design defaults, not yet measured"

[metadata.resources.caps]
main = { cpus = 4.0, memory_gb = 16.0, pids = 8192 }
sim = { cpus = 8.0, memory_gb = 24.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades it: the
# live episode's verdict, nothing replayed. The loops run on the clock, inside timeout_sec: the verdict
# ("finalized": true, set before any video is rendered) is in within seconds, or later after a crash-resume, which
# re-runs the journal (840 s at most); then the hook waits for the video, one pass over the trajectory after the verdict
# ("video_pending"), until 870 s -- a video that is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
# The agent container holds no simulator, but HumanCLAW's public repository holds recorded rollouts: the agent
# reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
