schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/humanclaw-sit-toilet-i01-privileged"
description = "HumanCLAW find-navigate-interact (toilet), one frozen HSSD episode: produce one replayable trajectory of at most 100 motion skills for a simulated human body. Find the toilet and move until your body is touching the target, with zero distance to the target object. Finally, sit on the toilet."
authors = [{ name = "Kangrui Wang" }]
keywords = ["robotics", "humanclaw", "habitat-sim", "humanoid", "navigation", "code-as-policy", "trajectory", "toilet"]

[metadata]
author_name = "Kangrui Wang"
task_type = "trajectory"
simulator = "humanclaw"
robot = "smplx-human"
family = "sit-toilet"
mode = "privileged"
dynamics = "static"
oracle = "full"
oracle_evidence = "navmesh oracle (privileged tools, closed loop, on L40S): 25 actions; two fresh-process replays on L40S succeed with equal final hashes (63306922fde2422b) from the start hash 48f65cafe6e09343; not replayed on another GPU model; image humanclaw-0.1.0, 2026-10-27"
instance_seed = 0
expert_time_estimate_hours = 0.5

[metadata.resources]
min_cpus = 4.0
min_memory_gb = 8.0
min_gpu_memory_gb = 4.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
verifier_min_cpus = 4.0
verifier_min_memory_gb = 8.0
verifier_min_gpu_memory_gb = 4.0
measured = "author estimate, not yet measured: MotionDiT 1.6 GB GPU (RTX 4090, 20 skills), Habitat EGL rendering on top"

[metadata.resources.limits]
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 24.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 24.0
measured = "design defaults, not yet measured"

[metadata.resources.caps]
main = { cpus = 8.0, memory_gb = 29.0, pids = 16384 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 4200.0              # two fresh-process replays at tests/grade.py's limit (1800 s each) + 600 s
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0              # HumanCLAW, both modes (tasks/humanclaw/README.md)
# HumanCLAW's public repository holds recorded rollouts (docs/analysis: action chains of these episodes): the agent
# reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 29696

[verifier.environment]
build_timeout_sec = 5400.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
