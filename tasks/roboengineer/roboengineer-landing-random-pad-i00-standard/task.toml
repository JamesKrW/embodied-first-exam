schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/data/", service = "sim" }, "/app/output/"]

[task]
name = "embodied-first-exam/roboengineer-landing-random-pad-i00-standard"
description = "Learn a safe, fast random-pad landing policy from noisy deployment feedback over bounded adaptation rounds."
keywords = ["robotics", "mujoco", "quadrotor", "policy", "system-identification", "standard-mode"]

[metadata]
collection = "roboEngineer"
embodiment = "drone"
task_type = "policy"
simulator = "mujoco"
robot = "intel-aero-partial"
family = "roboengineer/landing-random-pad"
dynamics = "static"
protocol = "eai-policy/1.0"
oracle = "full"
oracle_evidence = "Harbor 0.23.0 oracle agent on a cloud CPU host, 2026-10-18, image efe-private:quadrotor-landing-0.1.0: six safe held-out landings of six, mean score 84.11; nop 0."
instance_seed = 0
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"   # PROTOCOL H.4: nothing the agent started runs on when the sidecar finalizes
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "python -m scripts.quadrotor_landing.native.collect"
timeout_sec = 900

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 6144
storage_mb = 20480

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
