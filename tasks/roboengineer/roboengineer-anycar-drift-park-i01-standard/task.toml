schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, { source = "/data/", service = "sim" }, "/app/output/"]
[task]
name = "embodied-first-exam/roboengineer-anycar-drift-park-i01-standard"
description = "Follow the ordered U-bend, then slide sideways into a parallel-parking space between two stationary cars and hold a precise stop."
keywords = ["robotics", "policy", "adaptation", "mujoco"]
[metadata]
collection = "roboEngineer"
embodiment = "racing-car"
task_type = "policy"
simulator = "mujoco"
robot = "anycar"
family = "roboengineer/anycar-drift-park"
mode = "standard"
dynamics = "static"
protocol = "eai-policy/1.1"
oracle = "none"
oracle_evidence = "Harbor 0.23.0 oracle agent on a cloud CPU host, 2026-10-18, image efe-private:control-transfer-0.2.0: the reference controller (solution/, three feedback rounds) succeeded on 0/10 held-out cases, mean engineering score 0.00; nop 0. No full oracle: human review (PROTOCOL §4). No positive example yet."
instance_seed = 1
expert_time_estimate_hours = 4.0

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 1
allowed = [1]
oracle = []

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"
# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"   # PROTOCOL H.4: nothing the agent started runs on when the sidecar finalizes
timeout_sec = 30
[[verifier.collect]]
service = "sim"
command = "python -m scripts.control_transfer.trusted.collect"
timeout_sec = 1800
[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]
[environment]
build_timeout_sec = 2400.0
cpus = 2
memory_mb = 6144
storage_mb = 20480
[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
