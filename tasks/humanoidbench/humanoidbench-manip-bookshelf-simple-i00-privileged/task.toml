schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/humanoidbench-manip-bookshelf-simple-i00-privileged"
description = "HumanoidBench bookshelf_simple: produce one replayable trajectory that puts five objects onto their assigned bookshelf slots with the Unitree H1, frozen scene instance 00."
keywords = ["robotics", "humanoidbench", "code-as-policy", "trajectory", "h1hand", "manipulation", "bookshelf_simple"]

[metadata]
# trajectory | policy (see docs/protocol/README.md)
task_type = "trajectory"
simulator = "humanoidbench"
robot = "unitree-h1hand"
# HumanoidBench env h1hand-bookshelf_simple-v0; paper category manipulation; C9 · long-horizon multi-subtask
family = "bookshelf_simple"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration
# scene = environment/instance.npz (frozen MuJoCo state); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 5.0
oracle = "none"
oracle_evidence = "none known: no run has passed it, and published RL reaches 41% of the bar (paper 763, FastTD3 822, bar 2000); human review in PR #9"

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container, built from tests/Dockerfile (docs/protocol/README.md §2.6): the agent's container,
# where it was root, is gone by then, and only /app/output/ crosses over. It replays locally and the reward
# formula is live in it, so it gets no network either.
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 3600.0
# Deleting get_reward() from the image (images/humanoidbench/scrub_oracles.py) buys nothing if the agent
# can fetch it back -- upstream is pinned at a public commit, so one `curl raw.githubusercontent.com/...`
# restores the whole answer key (HumanoidBench is not on PyPI). Measured: with the default `public`
# baseline an agent-phase curl pulled basic_locomotion_envs.py and found 5 `def get_reward`.
# So the agent reaches the model APIs and the package registries, nothing else (scripts/set_agent_egress.py HOSTS).
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
# the deliverable is reachable by search; one episode is ~2.07 s of one core
cpus = 16
memory_mb = 20480
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
