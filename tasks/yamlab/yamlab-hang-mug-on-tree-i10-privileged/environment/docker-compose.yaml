# Isaac Sim needs an RTX-class NVIDIA GPU even headless. Harbor's local docker sandbox rejects [environment].gpus, but
# merging this onto the main service passes the device through. Isaac's shader/extension cache gets a volume for the
# trial, named after the trial's compose project (no fixed name: side-by-side trials must not share it; Harbor's
# teardown, `compose down --volumes`, deletes it): every trial compiles its shaders once (~2 min).
services:
  main:
    pids_limit: 4096   # rcb-monitor
    x-gpu-memory-gb: 16   # GiB   # rcb-monitor
    # yamlab-base (the first stage of the Dockerfile) is built from public sources; with read access to the prebuilt
    # image its layers are pulled instead (cache_from)
    build:
      cache_from: ["ghcr.io/mll-lab-nu/efe-private:yamlab-0.2.1"]
    shm_size: "8gb"
    volumes:
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
      - rcb_yamlab_cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:935a38662d5158d6091473c718a3c4c83fa43656e3548d4f84008dfc02678987
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_yamlab_cache:
