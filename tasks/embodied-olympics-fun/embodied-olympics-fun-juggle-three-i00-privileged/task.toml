schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-juggle-three-i00-privileged"
description = "Embodied Olympics juggle-three (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Juggle three balls in a cascade: throw each ball from one hand in an arc to the other, the hands in turn, catching each in the hand, until 10 catches have been made in a row. A referee of events, geometry and contact rules decides the success."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "juggle-three"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "juggle_three"
category = "throwing-catching-striking"
mode = "privileged"
dynamics = "dynamic"              # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration
network = "open"                 # the agent's egress (docs/protocol/README.md §2): open, the author's choice
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 16.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested: Positive by a declared magic action (both hands the G1's own Dex3-1 at the device's torques, palms up; no weld): the red ball's real lob from the ball machine into the left hand and every catch are real (the hand closes when the ball reaches the palm and holds it between thumb and fingers for 0.05 s); injected: each throw (the opened hand's ball put 0.10 m above and 0.12 m inwards with the velocity of a 0.45 m arc onto the other hand) and a correction 0.15 m above each catching hand (the ball over the palm, its horizontal speed zeroed): ten catches in the cascade's order, the same state hash twice; the hands closing 0.02 s before the ball reaches the palm also make ten, closing earlier lets it bounce off the closed fingers. Negatives: nop (the red ball comes down on the closed left hand and hits the body), the waiting ball pushed in the machine, a low throw that comes back to its own hand, the wrong ball thrown (not caught), a fall. Stress: random arm targets with the balls in the hands: the balls fall out (a ball touched the ground at 0.77 s), nothing more than 9.6 mm into anything. RTF with the two Dex3-1 hands (71 degrees of freedom): 0.41-0.57 on a slower host, about 0.9-1.6 on the workstation (below the 1.5 a realtime twin needs).; human review in the pull request that adds the benchmark (PROTOCOL §2.7)"

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in two fresh processes, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open (Harbor's default), as `[metadata] network` declares. Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
