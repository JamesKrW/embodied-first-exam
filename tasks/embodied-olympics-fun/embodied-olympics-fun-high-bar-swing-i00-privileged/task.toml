schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodied-olympics-fun-high-bar-swing-i00-privileged"
description = "Embodied Olympics high-bar-swing (one Unitree G1 on the Embodied Olympics simulator, MuJoCo 3.3.7, CPU) in privileged mode: produce one replayable trajectory. Standing on the block under the high bar, jump up and catch the bar with both grippers, then do one giant swing: take your extended body in a full circle around the bar, without letting go. A referee of events, geometry and contact rules decides the success."
authors = [{ name = "Kangrui Wang" }]
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-g1", "humanoid", "trajectory", "high-bar-swing"]

[metadata]
author_name = "Kangrui Wang"
task_type = "trajectory"
simulator = "mujoco"               # the Embodied Olympics simulator: MuJoCo 3.3.7 on the CPU with Embodied Olympics' robot library
robot = "unitree-g1"
family = "high_bar_swing"
category = "parkour-apparatus-balance"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration
network = "open"                 # the agent's egress (docs/protocol/README.md §2): open, the author's choice
# scene = environment/instance.json (the family's parameters + its t = 0 state hash); identity = the dataset.toml digest
instance_seed = 0
expert_time_estimate_hours = 12.0
oracle = "none"
oracle_evidence = "no reference solution; the referee is tested by scripts/embodied-olympics/tests/test_high_bar_swing.py: positive by a declared magic action (the G1 on a 1.0 m block; two Dex1-1 grippers with the clamp force raised 4.4 times to 528 N per jaw, declared; no weld): the jump is one injected velocity (1.82 m/s up, a 0.17 m rise, aimed so the bar enters the half-closed jaws), the jaws close in flight and catch the bar (1.6 body weights at the catch), then an injected spin as from 60 deg and a gravity-like drive of at most 400 N m about the bar (no joint loaded by it), limp wrists: a full extended circle in 4.58 s, bottom load 5.2 body weights (100 ms mean); the same state hash twice. The clamp force: the device's 120 N holds 1.41 body weights with both hands, a giant swing pulls at least 4.2 (gymnasts 3.5-3.7); 240, 360, 420 and 480 N per jaw all lose the bar in the same magic-action swing, 528 N completes it. Negatives: nop (time), no catch (jaws open: back on the block, time), starting already hanging (held the bar without jumping to it), grippers opened (let go), a fall from the block (the mats), a tucked circle and a circle that turns back (referee-only rotations: no count); stress: 4 s of random joint targets on the bar held (2.9 body weights), then the grippers opened let go in 0.06 s; the jaw pads press at most 5.8 mm into the bar.; human review in the pull request that adds the benchmark (PROTOCOL §2.7)"

[metadata.resources]
# minimum compute to run this task (docs/protocol/README.md §2.9)
min_cpus = 2.0
min_memory_gb = 4.0
min_gpu_memory_gb = 0.0
gpu_required = false
gpu_class = "none"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 3.0
verifier_min_gpu_memory_gb = 0.0
measured = "author estimate (an RTX 4090 workstation, 2026-10-11): CPU-only MuJoCo with OSMesa rendering; one world steps 5 times faster than real time on one core and holds about 0.4 GB; the verifier runs two replays and a filmed one"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/protocol/README.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 0.0
max_memory_gb = 13.0
max_processes = 512
max_disk_gb = 20.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 0.0
trial_max_memory_gb = 13.0
measured = "author estimate: no trials yet; memory under the 16 GiB cap by the margin the monitor needs (an agent may run several worlds at once or train a controller); disk 20 GiB for downloaded tools and controllers; processes 512: design default"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/protocol/README.md §2.10)
main = { cpus = 8.0, memory_gb = 16.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 900.0
# grade.py runs in its own container (tests/Dockerfile): the agent's container is gone by then and only /app/output/
# crosses over. It replays in two fresh processes, with no network.
environment_mode = "separate"
network_mode = "no-network"

# Resource limits (docs/protocol/README.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[verifier.environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 8192

[agent]
timeout_sec = 7200.0
# Egress: open (Harbor's default), as `[metadata] network` declares. Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md).

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
