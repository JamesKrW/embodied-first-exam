schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/trajectory_live.f64", service = "sim" },
  { source = "/data/referee.json", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/trajectory.first.npz", service = "sim" },
  { source = "/data/replay.first.mp4", service = "sim" },
  { source = "/data/replay.first.last.png", service = "sim" },
  { source = "/data/calls/", service = "sim" },
  { source = "/data/startups.jsonl", service = "sim" },
  { source = "/data/crash.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/embodied-olympics-fun-clean-and-jerk-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.1): Embodied Olympics clean-and-jerk on the same frozen instance as embodied-olympics-fun-clean-and-jerk-i00-privileged. Clean and jerk the barbell: lift it from its blocks to your shoulders, then to locked arms overhead, and hold it there motionless until the down signal. The agent only gets a client: the robot's two head cameras (depth on one), its joint sensors and IMUs, the venue's fixed camera, and action chunks (walking, running, joint targets, Unitree LowCmd, the hands' grip). 5 resets, the last attempt graded; no object state, no referee state during an attempt. The sim service records the attempt and grades it live with the family's referee (no grading replay)."
keywords = ["robotics", "embodied-olympics", "sports", "mujoco", "unitree-h1-2", "humanoid", "standard-mode", "trajectory", "clean-and-jerk"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "unitree-h1-2"
family = "clean_and_jerk"
category = "parkour-apparatus-balance"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.1"
instance_seed = 0
expert_time_estimate_hours = 16.0
oracle = "full"
oracle_evidence = "Reference (real, lowcmd rows, a quasi-static whole-body plan) for a block clean & jerk: the 5 kg technique bar on two 0.35 m lifting blocks (axis 0.375 m above the platform; declared: on 0.20 m blocks the squat would need the hips flexed past where the hip links meet the pelvis, and 52 squats tried all fell onto a thigh or knocked the bar). On 0.20 m blocks the planner's bottom poses put the hips 15 to 46 mm into the pelvis, or the thumbs into the knees. Heavier bars: with the women's 15 kg bar every path of the clean's turnover passes a pose with the bar level with the elbow joint, where the best arm pose found (with a gripper whose grip was 0.11 m further from the wrist) needs 1.08 to 1.17 times the elbow and shoulder motors' torque (0.54 with 5 kg); 10 kg (the bar on two 2.5 kg technique discs) topples the robot backwards at the turnover. It squats (knees 1.2 rad, pelvis 0.8 rad), closes the H1-2's own Inspire hands (their default forces, 20 N per fingertip, 30 N the thumb; no factor) round the bar, stands up, cleans to the shoulders, presses overhead and holds to the down signal: success at 20.29 s, no arm into the robot's own body; live, replay and the state hash agree. 4 of 7 neighbours succeed (servo gains x0.97 / x1.03, a squat at knees 1.4 / pelvis 0.9); a shallower squat, the bar 1 cm nearer or farther and the plan 10 % slower fail. Negatives: nop (time), the 0.20 m blocks' deeper squat (falls onto a thigh), the right hand never closed (no clean), both hands opened above knee height (let go), pushed over backwards, off the platform, the barbell on the floor, a foot on a block; stress: random arm targets at the rack. The privileged twin's reference rows (2029 control steps, success after 20.29 s) streamed through the client."

[verifier]
timeout_sec = 900.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

# Then the episode ends: SIGUSR1 to the service (re-sent every 30 s, in case it was restarting), which grades the live
# episode (no grading replay). The loops run on the clock, inside timeout_sec: the verdict ("finalized":
# true, written before any video is rendered) may take until 840 s (the end waits through a crash-recovery resume);
# then the hook waits for the video, one render pass from the trajectory ("video_pending"), until 870 s -- a video that
# is not ready by then is lost, the verdict is not.
[[verifier.collect]]
service = "sim"
command = "t0=$(date +%s); while [ ! -f /data/server.pid ] && [ $(( $(date +%s) - t0 )) -lt 120 ]; do sleep 2; done; i=0; while [ $(( $(date +%s) - t0 )) -lt 840 ] && ! grep -q '\"finalized\": true' /data/final.json 2>/dev/null; do [ $((i % 15)) -eq 0 ] && kill -USR1 $(cat /data/server.pid 2>/dev/null) 2>/dev/null; i=$((i + 1)); sleep 2; done; while [ $(( $(date +%s) - t0 )) -lt 870 ] && grep -q '\"video_pending\": true' /data/final.json 2>/dev/null; do sleep 2; done; cat /data/final.json"
timeout_sec = 900

[agent]
timeout_sec = 7200.0
# Egress: open, `network_mode = "public"` below (the author's choice). Embodied Olympics lets the agent search for and download
# public tools, robot models and pretrained controllers (owner, 2026-10-11; tasks/embodied-olympics-fun/README.md). The agent's
# container holds no simulator, no referee and no instance.
network_mode = "public"        # open egress, the task author's choice (docs/protocol/README.md Appendix H.6)

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 10240
storage_mb = 20480

[verifier.environment]
build_timeout_sec = 600.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
