schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/out/final.json", service = "sim" },
  { source = "/out/episode.jsonl", service = "sim" },
  { source = "/out/trajectory.npz", service = "sim" },
  { source = "/out/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/out/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/out/live.mp4", service = "sim" },             # the live episode's head camera, recorded while it ran
  { source = "/out/replay.mp4", service = "sim" },           # ... or the video-only render, only when that one is missing
  { source = "/out/video.log", service = "sim" },
  { source = "/out/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  "/app/output/",
]

[task]
name = "embodied-first-exam/ispatialgym-alignment-axial-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): iSpatialGym alignment_axial (upstream subtask alignment_axial_board_game, instance 0). The goal is an image: make the scene look like /app/goal.png, the head camera's view once the task is done. The agent only gets a client: the R1Pro's three RGB cameras, its proprioception in the odometry frame and stateless kinematics; 23-D JoyLo actions in chunks. No object poses, no goal check, no reset; the sim service records the episode and grades it as it runs (no replay)."
keywords = ["robotics", "ispatialgym", "spatial-intelligence", "goal-image", "omnigibson", "isaac-sim", "r1pro", "standard-mode", "trajectory", "alignment"]

[metadata]
task_type = "trajectory"
simulator = "ispatialgym"
robot = "r1pro"
family = "alignment_axial"
mode = "standard"                  # robot as a service: RGB + proprioception, no object poses, no success predicate, no reset
dynamics = "static"               # objects move only by the robot or gravity (tasks/ispatialgym/README.md)
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "upstream's goal image of this instance is the last frame of a successful replay of upstream's own demonstration of it (kmy17518/ispatialgym-eval-data@15cb9a7, ispatialgym-eval-instances/README.md, Goal images)"
instance_seed = 0
expert_time_estimate_hours = 1.0

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = []

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode, write final.json from the live episode's result (nothing is replayed)
timeout_sec = 5994               # the episode end (up to 1 h through a resume) + a video-only render (a scene load + 1612
                                  # steps), run only when the live video is missing, after the verdict + margin

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
