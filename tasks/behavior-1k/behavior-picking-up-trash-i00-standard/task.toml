schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/out/final.json", service = "sim" },
  { source = "/out/episode.jsonl", service = "sim" },
  { source = "/out/trajectory.npz", service = "sim" },
  { source = "/out/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/out/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/out/live.mp4", service = "sim" },             # the video, recorded during the live episode
  { source = "/out/replay.mp4", service = "sim" },           # ... or rendered by the video-only pass when that one is missing
  { source = "/out/replay.last.png", service = "sim" },
  { source = "/out/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/out/video.log", service = "sim" },             # the video-only pass, when it runs
  "/app/output/",
]

[task]
name = "embodied-first-exam/behavior-picking-up-trash-i00-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.2): BEHAVIOR-1K v3.9.2 picking_up_trash on the same frozen instance as the privileged task (2026 challenge public_test instance 301). Put the three cans of soda from the living room inside the trash can in the kitchen. The agent only gets a client: get_obs (RGB-D + proprioception), submit (joint_position or ee_pose chunks). No reset, no privileged state; the sim service records the episode as a trajectory, resumes it after a crash, and grades the episode it ran (no replay)."
keywords = ["robotics", "behavior", "omnigibson", "isaac-sim", "r1pro", "mobile-manipulation", "standard-mode", "trajectory", "picking_up_trash"]

[metadata]
task_type = "trajectory"
simulator = "behavior"
robot = "r1pro"
family = "picking_up_trash"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "partial"
oracle_evidence = "solution/ streams the privileged oracle's joint targets (oracle_qpos.npy, 5115 rows) through the client. Recorded Harbor oracle runs: 3 of 3 scored 1 on an RTX 4090 workstation (job v22-oracle-picking-up-trash-1741, best behavior-picking-up-trash-i00-li__eg8GdNj) on the dev branch 9eb18edf version of this task (rcb-limited/2.2, no crash recovery); 2026-09-25 behavior-picking-up-trash-i00-li__fyYUXt4 (laptop, an older version) scored 1 with live_matches_replay 1. The sim service, collect hook, grader and oracle client changed since (crash recovery); not re-run on this version (static validation only). Measured 2026-10-10 on main 332bf8080 (a cloud L40S host): scored 1 (5114 control steps; live, both replays and deterministic 1) once the oracle waited long enough for the service (the simulator took 620-682 s to start on those hosts, longer than the client's 600 s default wait at the time, which gave two 0-step runs; the default is 3600 s since)."
instance_seed = 301
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode (waits through a resume; the settle window on the live simulator), write
                                  # final.json from the live episode (no replay); a video-only render if the live video is missing
timeout_sec = 23400               # 6.5 h = the episode end (up to 2 h through a resume) + the video-only render, run only when
                                  # the live video is missing, after the verdict (a replay of up to 4 h, the privileged
                                  # grader's cap: PROTOCOL §4) + 30 min; measured on an 8-vCPU L40S: 626 s Isaac start,
                                  # < 3.5 steps/s. finalize.sh's BUDGET_S is this value: the render stops 5 min before it

[agent]
timeout_sec = 7200.0             # BEHAVIOR budget (Isaac Sim + scene load, ~10 steps/s), same as the privileged twin (tasks/behavior-1k/README.md)
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 24576
storage_mb = 20480
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
