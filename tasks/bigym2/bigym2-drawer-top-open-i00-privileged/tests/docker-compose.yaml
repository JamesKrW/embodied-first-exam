# The verifier replays in MuJoCo and renders like the agent's environment (environment/docker-compose.yaml).
services:
  main:
    x-gpu-memory-gb: 6   # rcb-monitor GPU memory cap, GiB (docs/protocol/README.md §6)
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,graphics,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
