schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/robotwin_2_0_put_bottles_dustbin-privileged"
description = "RoboTwin 2.0 put_bottles_dustbin (ALOHA-AgileX dual arm, SAPIEN): produce one replayable trajectory. Put all three bottles into the dustbin that stands on the floor at the robot's left (x = -0.45). Only the left arm can reach the dustbin, so bottles on the right half of the table must be handed over from the right arm to the left arm in the air. Frozen scene instance (RoboTwin seed 28831)."
keywords = ["robotics", "robotwin", "sapien", "aloha-agilex", "dual-arm", "code-as-policy", "trajectory", "put_bottles_dustbin"]

[metadata]
task_type = "trajectory"          # trajectory | policy   (see docs/protocol/README.md)
simulator = "robotwin"            # RoboTwin 2.0 = SAPIEN 3 / PhysX + CuRobo
robot = "aloha-agilex"
family = "put_bottles_dustbin"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
oracle = "full"
instance_seed = 28831             # scene = environment/instance.json (RoboTwin seed + expected initial-state hash); identity = dataset.toml digest
expert_time_estimate_hours = 0.5

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # PROTOCOL H.6: the verifier has no network

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 1800.0
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 10240
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
