schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-book-page-turn-i00-privileged"
description = "Turn exactly one rigid board page of a free board book lying open on a desk with the Tianji Marvin two-arm robot and its dexterous hands (Sharpa Wave by default, or Wuji Hand 2.2): every board lies flat on its stack, so the robot has to separate the top right-hand board itself, carry it past vertical over the spine and lay it on the left stack, then let go; a shoved book, a second page or a closing cover fails the episode at once."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "articulated_object_manipulation", "articulated", "page-turning", "thin-objects", "book", "bimanual", "arm"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "marvin-bimanual-sharpa-wave"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "book_page_turn"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration

oracle = "full"
oracle_evidence = "solution/ replays the recorded Sharpa Wave episode on the Marvin arms in both modes (553 rows; success after 453 controls): two fresh-process replays with identical state hashes, float32 rows succeed. No Wuji reference solution."
expert_time_estimate_hours = 3.0
difficulty = "hard"
release_status = "provisional"

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 1500.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
