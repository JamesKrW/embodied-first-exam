schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/", { source = "/data/final.json", service = "sim" }, { source = "/data/episode.jsonl", service = "sim" }, { source = "/data/trajectory.npz", service = "sim" }, { source = "/data/replay.mp4", service = "sim" }, { source = "/data/server.log", service = "sim" }, { source = "/data/journal.f64", service = "sim" }, { source = "/data/startups.jsonl", service = "sim" }, { source = "/data/video.json", service = "sim" }, { source = "/data/video.log", service = "sim" }]

[task]
name = "embodied-first-exam/dexhand-stool-brace-insert-i00-standard"
description = "With one dexterous hand (Sharpa Wave by default, or Wuji Hand 2.2) on a six-axis wrist stage, pick up the loose cross brace of an ODDVAR-style pine stool dry frame, stand it in the empty bore of the lower side frame, then lift the opposite side frame onto all four upper dowels so both brace dowels are seated in their legs; drops, knocked rails or a displaced frame fail at once."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "furniture_assembly", "furniture-assembly", "dowel-insertion", "peg-in-hole", "multi-object", "in-hand-regrasp"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "sharpa-wave-floating"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "stool_brace_insert"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.2"
oracle = "full"
oracle_evidence = "solution/trajectory.npz replays a Sharpa Wave authoring trajectory (3,006 controls; success after 2,806) in both modes: two fresh-process replays with identical state hashes, float32 rows succeed, Harbor oracle 1 in privileged and standard mode (standard: rows submitted through the public client, live hash = replay hash)."
instance_seed = 0
expert_time_estimate_hours = 4.0
difficulty = "hard"
release_status = "provisional"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end the episode, write its live verdict (no replay), then one video pass
timeout_sec = 2820                # the end wait, the video and a margin

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
