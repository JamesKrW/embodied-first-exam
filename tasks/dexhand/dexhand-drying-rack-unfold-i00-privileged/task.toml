schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-drying-rack-unfold-i00-privileged"
description = "Unfold a stored folding sweater dryer with one dexterous hand (Sharpa Wave by default, or Wuji Hand 2.2): swing the folded half open about the passive pole hinge, flip out all four passive legs, turn the open rack over and stand it on its four feet; a dropped, collapsed or fallen rack fails the episode at once."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "articulated_manipulation", "articulated-mechanism", "folding", "flip", "regrasp", "passive-hinges"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "sharpa-wave-floating"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "drying_rack_unfold"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration

oracle = "full"
oracle_evidence = "solution/trajectory.npz replays the recorded Sharpa Wave authoring episode (2,415 controls, success after 2,315). The rows are float32-exact, so the standard oracle submits the same rows through the client. Two fresh-process replays succeed with identical state hashes."
instance_seed = 0
expert_time_estimate_hours = 6.0
difficulty = "hard"
release_status = "provisional"

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
