schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-grinder-crank-i00-privileged"
description = "With a fixed dual-arm robot (Tianji Marvin, a dexterous hand on each arm: two Sharpa Wave hands by default, or two Wuji Hand 2.2), counterhold a free-standing manual coffee grinder with one hand and turn its passive, friction-loaded crank two full turns clockwise by the knob with the other, then let go and leave it standing; tipping, sliding, spinning or reversing the crank fails at once."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "tool_mechanism", "bimanual", "dual-arm", "tool-mechanism", "crank", "counterhold", "passive-mechanism"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "marvin-bimanual-sharpa-wave"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "grinder_crank"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration

oracle = "full"
oracle_evidence = "solution/trajectory.npz: 1,096 Sharpa Wave rows on the Marvin dual-arm robot (success after 996 controls, 100 rows of slack), recorded from the authoring controller through its arm layer (IK to arm joint targets; motor targets only). Two fresh-process replays end with identical state hashes; float32-rounded rows also succeed. Wave-3 port of the 2026-10-14 floating-stage oracle."
expert_time_estimate_hours = 3.0
difficulty = "hard"
release_status = "provisional"

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 2100.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
