schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-essential-two-object-i00-privileged"
description = "Rotate and selectively release walnut A while independently retaining walnut B. Both walnuts use authentic closed-shell scan geometry with non-spherical convex-hull collision and the same material properties."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "multi_object"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "sharpa-wave-floating"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "essential_two_object"
mode = "privileged"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration

oracle = "full"
oracle_evidence = "solution/trajectory.npz is the validated Sharpa Wave actuator trajectory of this frozen instance (408 controls at 50 Hz, physical contact only). The privileged oracle hands it in; the standard oracle submits the same rows as float64 through the client's request path (the service executes the validated targets bit for bit). Both replay to success in two fresh processes with identical final state hashes; float32-rounded copies of all six oracles also score 1. Human solvability review is pending; release status stays provisional. solution/wuji/trajectory.npz is a validated Wuji Hand 2.2 trajectory of this instance (266 controls, motor targets only, physical contact only); the oracle uses it when the run selects wuji (privileged: DEXHAND_HAND=wuji; standard: the sim service's hand), and it replays to success in two fresh processes with identical state hashes."
expert_time_estimate_hours = 2.0
difficulty = "hard"
release_status = "provisional"

[metadata.seeds]
# the instances this task may run from (docs/protocol/README.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0]
oracle = [0]

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
