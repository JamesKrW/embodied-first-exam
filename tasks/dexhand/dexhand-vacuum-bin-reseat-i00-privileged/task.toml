schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/dexhand-vacuum-bin-reseat-i00-privileged"
description = "Service a handheld vacuum with two dexterous hands (Sharpa Wave by default, or Wuji Hand 2.2) on two wrist stages: one hand holds the vacuum by its handle while the other presses the spring release button, takes the transparent dust bin off its lower ledges, puts it back tabs-first and closes it until the latch tooth snaps behind the bin's catch (source latch friction 0.55 and 6 mm button travel); any drop, knock-off or disturbed vacuum fails the episode at once."
keywords = ["robotics", "dexterous-hand", "mujoco", "sharpa-wave", "wuji-hand-2.2", "household_maintenance", "household-maintenance", "latch", "spring-release", "articulated-mechanism", "remove-and-reinstall", "free-objects"]

[metadata]
task_type = "trajectory"
simulator = "mujoco"
robot = "sharpa-wave-floating-bimanual"
hands = ["sharpa", "wuji"]
default_hand = "sharpa"
family = "vacuum_bin_reseat"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration

oracle = "full"
oracle_evidence = "solution/trajectory.npz: 1,331 two-hand Sharpa Wave control rows recorded from the closed-loop authoring controller (the left hand holds the vacuum by its handle, the right hand presses the release button, removes and reinstalls the bin); the replay ends at success after 1,181 controls (150 slack rows) in two fresh processes with identical state hashes, also with rows rounded to float32. The standard oracle submits the same rows as float64 through the public client."
instance_seed = 0
expert_time_estimate_hours = 3.0
difficulty = "hard"
release_status = "provisional"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 10240
storage_mb = 10240

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
