schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/episode.json", service = "sim" },             # the live result the service dumped at the episode end
  { source = "/data/server.log", service = "sim" },               # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },              # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },           # crash recovery: one line per service start
  { source = "/data/startup_binding.json", service = "sim" },
  { source = "/data/replay.video.json", service = "sim" },          # the video-only pass's record
  { source = "/data/replay.frame_map.jsonl", service = "sim" },
  { source = "/data/replay.recording_manifest.json", service = "sim" },
  { source = "/data/replay.json", service = "sim" },              # the collect hook's video-only pass (stdout)
  { source = "/data/replay.log", service = "sim" },
  "/app/output/",
]

[task]
name = "embodied-first-exam/roboarc-horseshoe-ring-05-i01-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.4): RoboARC horseshoe_ring on the same frozen instance as the privileged task. Separate and place the entire removable ring inside the green dashed goal region. Keep the horseshoes and chains on the puzzle/system side. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
keywords = ["robotics", "roboarc", "mujoco", "aloha", "standard-mode", "trajectory", "horseshoe_ring"]

[metadata]
task_type = "trajectory"
simulator = "roboarc"
robot = "aloha-2"
family = "horseshoe_ring"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2): the task's own declaration
protocol = "eai-standard/2.4"
oracle = "full"
difficulty = "hard"
grasp = "assisted (the contact_weld_v1 grasp regions on horseshoe_left, horseshoe_right, target_ring)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision placement_region_v3_grasp_contact_2mm)"
tooling_version = "19"
instance_seed = 0
expert_time_estimate_hours = 3

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container. Harbor stops that container only after
# collecting from it (~12 s), and a script still running there would keep driving the robot past the deadline.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, write final.json (the live verdict), then one video-only replay
timeout_sec = 27000              # the end (a resume replay included) <= 1 h; the video pass after the verdict <= the agent's budget

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
