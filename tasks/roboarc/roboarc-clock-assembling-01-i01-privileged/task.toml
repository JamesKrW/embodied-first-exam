schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/roboarc-clock-assembling-01-i01-privileged"
description = "RoboARC clock_assembling (ALOHA 2, MuJoCo): produce one replayable trajectory. Assemble the watch movement's gear train: the four wheels on their pivots in the main plate, the train bridge over them on its pillars with every upper pivot in its hole, the two bridge screws tight; then wind the barrel through its ratchet, let go and watch the fourth wheel run. Frozen scene instance (variation clock_assembling_gear_train, seed 0)."
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "clock_assembling"]

[metadata]
tooling_version = "22"
task_type = "trajectory"
simulator = "roboarc"
robot = "aloha-2"
family = "clock_assembling"
dynamics = "dynamic"
oracle = "full"
difficulty = "hard"
grasp = "assisted (contact_weld_v1 on every part; the grippers start empty)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision clock_gear_train_v3)"
instance_seed = 0
expert_time_estimate_hours = 3.0

[metadata.seeds]
# the seeds a runner may draw from (a list, { from = A, to = B } or "any") and the ones the reference solution
# under solution/ is for, where they are not the default seed alone (docs/protocol/README.md §2)
allowed = [0, 1, 2]
oracle = [0, 1]
build = "runtime"

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL Appendix H.6
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 16
memory_mb = 30720
storage_mb = 10240

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
