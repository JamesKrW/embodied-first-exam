schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/tactilelab-sleeve-pull-on-forearm-i00-privileged"
description = "TactileLab sleeve_pull_on_forearm (dual-arm X-Trainer whose right gripper carries two GelSight Mini tactile sensors, Isaac Lab 2.3 / Isaac Sim 5.1, PhysX on the GPU): produce one replayable trajectory. Pull the sleeve along the other arm's forearm to the target band. Frozen scene instance (the fixed nominal scene, seed 0)."
authors = [{ name = "Haoran Lu" }]
keywords = ["robotics", "tactilelab", "isaac-lab", "isaac-sim", "x-trainer", "tactile", "gelsight-mini", "code-as-policy", "trajectory", "sleeve_pull_on_forearm"]

[metadata]
author_name = "Haoran Lu"
task_type = "trajectory"          # trajectory | policy   (see docs/protocol/README.md)
simulator = "tactilelab"              # TactileLab tasks on Isaac Lab 2.3.2 / Isaac Sim 5.1 (PhysX on the GPU, RTX rendering, Taxim tactile images)
robot = "xtrainer-gsmini"
family = "sleeve_pull_on_forearm"
dynamics = "static"               # scene dynamics (docs/protocol/README.md §2.14): the task's own declaration
oracle = "full"
oracle_evidence = "solution/: the scripted demonstration policy of this task, recorded through the Session; graded 1 by two fresh-process replays on an L40S, which ended in the same state."
instance_seed = 0                 # scene = environment/instance.json (the scene state after reset + its hash); identity = dataset.toml digest
expert_time_estimate_hours = 1.0

[verifier]
timeout_sec = 19800.0             # 2 fresh-process replays (6400 s each, tests/test.sh --replay-limit-s), the video
                                  # replay (6400 s) and 600 s; agent-independent: twice a 4,860-step replay at the slowest measured pace
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"       # PROTOCOL H.6: the verifier has no network

# Resources (docs/protocol/README.md §6): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 3600.0              # TactileLab budget (tasks/tactilelab/README.md): every Python process pays ~1 min of Isaac Sim launch + scene build
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL §2.11
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 16384
storage_mb = 20480
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 19456
storage_mb = 20480

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
