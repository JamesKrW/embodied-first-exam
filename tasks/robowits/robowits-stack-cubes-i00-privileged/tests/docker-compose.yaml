# The verifier replays in the simulator, which needs the GPU for Genesis' EGL cameras (the replay video).
services:
  main:
    x-gpu-memory-gb: 6   # GiB of GPU memory (docs/protocol/README.md §6)   # rcb-monitor
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
