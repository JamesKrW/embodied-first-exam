# Standard mode: EmbodiedSWE runs in the `sim` sidecar (GPU PhysX + cameras); the agent's container has only the client and
# reaches it on localhost:8000. Crash recovery: docs/protocol/standard_mode.md; the Kit cache is a trial-scoped volume.
services:
  main:
    pids_limit: 1024   # rcb-monitor
    volumes:   # rcb-monitor
      - rcb_limits:/run/rcb-limits:ro   # rcb-monitor
    depends_on: [sim]
  sim:
    cpus: 8   # rcb-monitor
    mem_limit: 24576m   # rcb-monitor
    pids_limit: 2048   # rcb-monitor
    x-gpu-memory-gb: 18   # GiB   # rcb-monitor
    build:
      context: ./sim
      dockerfile: Dockerfile
    volumes:
      - rcb_observe:/run/rcb-observe:ro   # rcb-monitor
      - esw_cache_trusted:/cache
    working_dir: /tmp
    command: sh /srv/run.sh
    restart: on-failure:6
    environment:
      RCB_DATA: /data
      RCB_WALL_CLOCK_S: "14400"
      RCB_STARTUP_TIMEOUT_S: "900"
      PYTHONPATH: /srv:/opt/embodiedswe
      RCB_SESSION_LOG: ""
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # >>> rcb_monitor (resource monitor, PROTOCOL §6; generated by images/monitor/rcb_monitor/inject.py)
  rcb_monitor:
    image: ghcr.io/mll-lab-nu/efe:monitor-0.5.0@sha256:ecc5f24f1516ca11711d7c2d3ac07c89f79cd9220812c1244498ec71e352402a
    pid: host
    cgroup: host
    network_mode: none
    cap_add: [SYS_PTRACE]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 64
    restart: on-failure
    working_dir: /var/rcb-monitor
    volumes:
      - ./rcb_monitor/limits.json:/opt/rcb_monitor/limits.json:ro
      - rcb_limits:/run/rcb-limits
      - rcb_observe:/run/rcb-observe
    environment:
      RCB_LIMITS_ENFORCE: ${RCB_LIMITS_ENFORCE:-0}
      RCB_LIMITS_TOLERANCE: ${RCB_LIMITS_TOLERANCE:-0.05}
    command: ["python3", "/opt/rcb_monitor/monitor.py", "run"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # <<< rcb_monitor
volumes:
  rcb_limits:   # rcb-monitor
  rcb_observe:   # rcb-monitor
  esw_cache_trusted:
