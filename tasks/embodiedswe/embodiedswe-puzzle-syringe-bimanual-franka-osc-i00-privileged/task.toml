schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "embodied-first-exam/embodiedswe-puzzle-syringe-bimanual-franka-osc-i00-privileged"
description = "EmbodiedSWE puzzle.syringe.bimanual_franka.osc (robobench at 67f44e8a2ca5, Isaac Lab 2.3.2 / Isaac Sim 5.1, GPU PhysX): deliver a program, solution/solve.py with solve(env), that completes the task when the verifier runs it against a fresh simulator built from the frozen instance (seed 0)."
keywords = ["robotics", "embodiedswe", "isaac-lab", "isaac-sim", "code-as-policy", "program", "bimanual", "tool-use", "dosing", "franka", "puzzle.syringe.bimanual_franka.osc"]

[metadata]
task_type = "policy"              # the deliverable is a program, run by the verifier (PROTOCOL H.1)
simulator = "embodiedswe"         # EmbodiedSWE's robobench on Isaac Lab 2.3.2 / Isaac Sim 5.1, GPU PhysX
robot = "franka-panda-bimanual"
family = "puzzle.syringe.bimanual_franka.osc"
dynamics = "static"
oracle = "none"
oracle_evidence = "No reference solution in the repository, and none written for this scene yet; the build, the start-state hash and a do-nothing run scoring 0 are checked."
instance_seed = 0
upstream_commit = "67f44e8a2ca51c3e133867e5e669377778e8f97d"
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 122550.0            # (64 checkpoints + final) x (1800 + 30 grace) + video (900 + 1800 + 600) + 300
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 29696
storage_mb = 10240
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.environment]
build_timeout_sec = 5400.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
