schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, 
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/live.mp4", service = "sim" },               # the live episode's video (filmed by the service)
  { source = "/data/live.last.png", service = "sim" },
  { source = "/data/server.log", service = "sim" },            # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },           # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },        # crash recovery: one line per service start
  { source = "/data/video.log", service = "sim" },             # the collect hook's video encode (never decides anything)
  "/app/output/",
]

[task]
name = "embodied-first-exam/embodiedswe-assembly-pc-gpu-ram-franka-osc-i00-standard"
description = "EmbodiedSWE assembly.pc_gpu_ram.franka.osc (robobench at 67f44e8a2ca5, Isaac Lab 2.3.2 / Isaac Sim 5.1, GPU PhysX), standard mode: the frozen instance of the privileged twin (seed 0) served by a sim sidecar; the agent gets only the client (camera images, depth, proprioception; ee_pose chunks), one episode, no reset, graded live."
keywords = ["robotics", "embodiedswe", "isaac-lab", "isaac-sim", "assembly", "insertion", "pc-building", "franka", "assembly.pc_gpu_ram.franka.osc", "standard-mode", "trajectory"]

[metadata]
task_type = "trajectory"
simulator = "embodiedswe"
robot = "franka-panda"
family = "assembly.pc_gpu_ram.franka.osc"
dynamics = "static"
protocol = "eai-standard/2.2"
oracle = "none"
oracle_evidence = "No reference solution in the repository, and no positive example yet; nop scored 0 (Harbor, L40S, 2026-10-29). Human review per family (PROTOCOL §4)."
instance_seed = 0
upstream_commit = "67f44e8a2ca51c3e133867e5e669377778e8f97d"
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

# Resources (PROTOCOL §6): seal the monitor's record first.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

# The agent's time is up: stop whatever it left running in its container, so no script keeps driving the robot.
[[verifier.collect]]
service = "main"
command = "kill -9 -1 2>/dev/null; exit 0"
timeout_sec = 30

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, write final.json from the live episode (no replay), encode live.mp4
timeout_sec = 3600                # = finalize.sh's HOOK_BUDGET_S (keep them equal)

[agent]
timeout_sec = 14400.0
network_mode = "allowlist"
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 5400.0
cpus = 8
memory_mb = 24576
storage_mb = 10240
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
