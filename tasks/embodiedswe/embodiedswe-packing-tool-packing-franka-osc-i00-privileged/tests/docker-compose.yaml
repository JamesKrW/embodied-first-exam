# The verifier runs Isaac Sim, which needs the GPU. Its Kit cache is a TRUSTED volume (Kit imports generated Python from it).
services:
  main:
    shm_size: "8gb"
    volumes:
      - esw_cache_trusted:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  esw_cache_trusted:
