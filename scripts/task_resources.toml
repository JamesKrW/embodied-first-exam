# Resource caps per task: the rules of docs/protocol/README.md §6 (the format, what normalize writes where, what enforces
# each cap; CONTRIBUTING.md step 3 has an example). Every number is an upper bound for ONE container. Edit the values
# here, never in a task, then run python3 scripts/task_conventions.py <task dirs>. The comment above each rule counts the
# tasks it applies to (the last rule that matches a task wins).

# 100 task(s)
[[cap]]
match = "^behavior-.*-privileged$"
main = { cpus = 8, memory_gb = 29, pids = 16384, gpu_memory_gb = 24, disk_gb = 20 }
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
measured = "GPU memory 8.3-9.0 GB with RCB_TEXTURE_BUDGET=0.1, the tasks' default (a per-container sampler every 30 s, trials on 14 GPU hosts); CPU 6-9 cores per trial; 13-16 GB of memory per Isaac process"
caps_measured = "GPU memory: the reference solution alone holds 15.1 GiB for most of the episode on a 48 GB card with RCB_TEXTURE_BUDGET=0.1, the tasks' default (three oracle runs of two tasks on two hosts; trials without the budget reached 29.0 GiB on 48 GB cards) -> max(1.5 x peak, peak + 4), rounded up: 24 GiB"

# 100 task(s)
[[cap]]
match = "^behavior-.*-standard$"
main = { cpus = 8, memory_gb = 24, pids = 16384, disk_gb = 20 }
sim = { cpus = 12, memory_gb = 50, pids = 16384, gpu_memory_gb = 16 }
gpu_types = ["L40S", "L40", "L4", "RTX 4090", "RTX 6000 Ada"]
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
measured = "GPU memory 8.3-9.0 GB with RCB_TEXTURE_BUDGET=0.1, the tasks' default (a per-container sampler every 30 s, trials on 14 GPU hosts); CPU 6-9 cores per trial; 13-16 GB of memory per Isaac process"
caps_measured = "GPU memory (the sim service): 9.0 GiB with RCB_TEXTURE_BUDGET=0.1, the tasks' default (trials without the budget reached 29.0 GiB on 48 GB cards) -> max(1.5 x peak, peak + 4), at least 16 GiB for Isaac Sim: 16 GiB"

