# Resource caps per task (docs/protocol/README.md §6). Every number is an upper bound for ONE container; there are no
# minimums and no soft limits. scripts/task_conventions.py (`normalize`) applies the LAST rule whose `match` (a regular
# expression) finds the task directory name, whole (rules are not merged), and writes:
# - main's cpus, memory_gb (GiB), disk_gb (GiB) and gpu_types into task.toml [environment] as Harbor's `cpus`,
#   `memory_mb`, `storage_mb` and `gpu_types` (gpu_types only for a task that needs an RTX-class GPU);
# - main's pids and every other service's cpus, memory_gb and pids into environment/docker-compose.yaml (`pids_limit`,
#   `cpus`, `mem_limit`), and gpu_memory_gb (GiB) as `x-gpu-memory-gb` on the service that holds the GPU
#   (images/monitor/rcb_monitor/inject.py; a separate verifier's GPU service in tests/docker-compose.yaml gets main's).
# Docker enforces CPU (a throttle), memory (the kernel's OOM killer) and processes; GPU memory and disk are measured by
# the resource monitor and enforced only when a run sets RCB_LIMITS_ENFORCE=1 (docs/protocol/running.md "Resources").
# `recommended_gpu`, `measured` (what the task was measured to use) and `caps_measured` (where the GPU-memory and disk
# caps come from) go into the README's `## Resources`. Edit the values here, never in a task.

# 100 task(s)
[[cap]]
match = "^behavior-.*-privileged$"
main = { cpus = 8, memory_gb = 29, pids = 16384, gpu_memory_gb = 24, disk_gb = 20 }
gpu_types = ["L40S", "L4", "RTX 4090", "RTX 6000 Ada"]
recommended_gpu = "L40S 48GB / L4 24GB / RTX 4090 24GB"
measured = "GPU 9 GB with RCB_TEXTURE_BUDGET=0.1 (evaluation-pool GPU-memory override; live sampler (docker stats + cgroup anon + nvidia-smi every 30 s, 13 cloud GPU hosts + an RTX 4090 workstation, 10-10): 8.3-9.0 GB); CPU 6-9 cores per trial (ps); author: 13-16 GB of RAM per Isaac process"
caps_measured = "GPU: 15.1 GiB held for most of the episode by the reference solution alone on a 48 GB card (L40S) with RCB_TEXTURE_BUDGET=0.1, the tasks' default (the tasks' own monitor, three oracle runs of two tasks on two hosts, 10-10: 15.14-15.15 GiB; the 9.0 GiB of the live sampler (nvidia-smi every 30 s, 13 cloud GPU hosts + an RTX 4090 workstation) was below that; uncapped trials reached 29.0 GiB on 48 GB cards, the evaluation pool's GPU profile) -> max(1.5 x peak, peak + 4) rounded up to 24 (was 16: 5 % above the reference solution's own use); memory: the [environment] cap 24 GiB, which every past trial ran under (docker peak 23.8 GiB over 5 samples, mem_guard (docker memory incl. page cache, top-4 containers every 10 min, an RTX 4090 workstation, 10-02..10)); processes 512 and disk 20 GiB: design defaults, not yet measured"

